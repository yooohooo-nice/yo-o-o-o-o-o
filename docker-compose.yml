# 用法：在 .env 里用 COMPOSE_PROFILES 选择要启用的可选服务，然后
#   docker compose up -d --build
# 可选服务：
#   caddy         公网服务器 + 域名，自动 HTTPS
#   flaresolverr  用无头 Chrome 自动通过 Cloudflare 验证（多占约 500MB 内存）
# 例：COMPOSE_PROFILES=caddy,flaresolverr
# 家里电脑 / Tailscale 不需要 caddy，启动后执行：tailscale serve --bg 3000
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://liuguang:${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}@db:3306/liuguang
      # 前面始终有 Caddy 或 Tailscale serve 做反向代理，它们会覆盖客户端伪造的 X-Forwarded-For。
      TRUST_PROXY: "1"
      # 所有对源站的请求都经过 fetcher，用伪装成 Chrome 的方式访问以绕过 Cloudflare。
      FETCHER_URL: http://fetcher:8080/fetch
    # 只监听本机，外部无法直接访问 3000 端口，必须经过 Caddy / Tailscale。
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      fetcher:
        condition: service_started

  # 浏览器伪装抓取服务（curl_cffi），只在内部网络可见，不对外开放端口。
  fetcher:
    build: ./fetcher
    restart: unless-stopped
    environment:
      # flaresolverr 没启用时连接会失败，fetcher 会自动跳过这一步。
      FLARESOLVERR_URL: http://flaresolverr:8191/v1

  flaresolverr:
    # 用最新版：Cloudflare 的检测经常更新，旧版 Chrome 更容易被拦。
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["flaresolverr"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      TZ: Asia/Shanghai

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: liuguang
      MARIADB_USER: liuguang
      MARIADB_PASSWORD: ${DB_PASSWORD:?请在 .env 里设置 DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    # 小内存服务器上压低 MariaDB 占用；只存两张很小的表，足够用。
    command:
      - --innodb-buffer-pool-size=32M
      - --performance-schema=OFF
      - --max-connections=30
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  caddy:
    image: caddy:2.8
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
